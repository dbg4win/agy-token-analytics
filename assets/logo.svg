<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="tcl-ring" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tcl-bar" x1="42" y1="46" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Background track ring (~10% outer margin) -->
  <circle cx="64" cy="64" r="46" stroke="#64748B" stroke-opacity="0.28" stroke-width="10"/>
  <!-- Active context gauge arc -->
  <circle cx="64" cy="64" r="46" stroke="url(#tcl-ring)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="212 78" transform="rotate(-110 64 64)"/>
  <!-- Inner token bars -->
  <rect x="42" y="64" width="10" height="22" rx="4" fill="#38BDF8"/>
  <rect x="59" y="46" width="10" height="40" rx="4" fill="url(#tcl-bar)"/>
  <rect x="76" y="54" width="10" height="32" rx="4" fill="#10B981"/>
</svg>
